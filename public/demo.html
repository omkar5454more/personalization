<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo store</title>
<!-- Snippet is injected from ?site=... so the demo works for any site you create. -->
<script>
  var q = new URLSearchParams(location.search), site = q.get("site");
  if (site) {
    document.write('<style id="ot-hide">body{opacity:0!important}</style>');
    setTimeout(function () { var h = document.getElementById("ot-hide"); h && h.remove(); }, 1500);
    document.write('<script src="' + encodeURI(q.get("sdk") || "") + '/sdk.js" data-site="' + encodeURIComponent(site) + '" async><\/script>');
  }
</script>
<style>
  body{font:16px/1.6 system-ui;margin:0;color:#1b1f27}
  nav{display:flex;gap:16px;padding:14px 24px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff}
  nav a{color:#2a78d6;cursor:pointer;text-decoration:none}
  main{max-width:680px;margin:0 auto;padding:0 16px 80px}
  section{min-height:420px;border-bottom:1px dashed #ddd;padding:24px 0}
  button,input[type=submit]{font-size:16px;padding:10px 18px;cursor:pointer}
  input[type=text],input[type=email]{font-size:16px;padding:8px;margin:4px 0;width:100%;box-sizing:border-box}
</style>
</head>
<body>
  <nav><a data-route="/demo">Home</a><a data-route="/demo/pricing">Pricing (SPA route)</a><a href="https://example.com/" target="_blank" rel="noopener">Partner site</a></nav>
  <main>
    <section id="s1">
      <h1>Welcome to the demo store</h1>
      <p>Original headline lives in the h1 above. Create a test with selector <code>h1</code> to change it.</p>
      <button id="buy-button" onclick="window.OT&&OT.track('purchase')">Buy now</button>
      <button id="wishlist">Add to wishlist</button>
      <p id="who"></p>
    </section>
    <section id="s2"><h2>Features</h2><p>Scroll down to exercise scroll-depth tracking.</p><a href="/demo/files/brochure.pdf">Download brochure (PDF)</a></section>
    <section id="s3"><h2>Contact us</h2>
      <form id="contact" onsubmit="event.preventDefault();document.getElementById('sent').textContent='Thanks!'">
        <input type="text" name="name" placeholder="Your name"><input type="email" name="email" placeholder="Email">
        <input type="submit" value="Send message"> <span id="sent"></span>
      </form></section>
    <section id="s4"><h2>Footer</h2><p>You reached the bottom.</p></section>
  </main>
  <script>
    // tiny fake SPA router so route-change tracking can be tested
    document.querySelectorAll("[data-route]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        history.pushState({}, "", a.getAttribute("data-route") + location.search);
        document.querySelector("h1").textContent = a.textContent.indexOf("Pricing") === 0 ? "Pricing" : "Welcome to the demo store";
      });
    });
    setTimeout(function () {
      document.getElementById("who").textContent = window.OT
        ? "Visit #" + OT.visitor.visitNo + (OT.visitor.isReturning ? " (returning)" : " (new)")
        : "Add ?site=YOUR_SITE_ID to the URL to load the SDK.";
    }, 600);
  </script>
</body>
</html>
